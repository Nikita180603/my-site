{{define "layout"}}
<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{.Title}}</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/styles.css">
</head>
<body>

	<img class="portrait" src="/photo.jpg" alt="{{.Name}}"/>

	<header>
		<p class="eyebrow">личное</p>
		<h1>{{.Name}}</h1>
	</header>

	{{template "content" .}}

	<nav class="pages">
		{{range .Nav}}
		<a href="{{.Path}}">{{.Label}}</a>
		{{end}}
	</nav>

</body>
</html>
{{end}}
